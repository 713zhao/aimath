name: aimath
description: >
  AI Math - A kid-friendly math practice app for primary students to learn 
  addition, subtraction, multiplication, and division through fun, interactive 
  exercises with progress tracking and achievements.

publish_to: 'none'

# App Version: Major.Minor.Patch+BuildNumber
# Increment build number for each release
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  
  # Local Storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # Audio
  just_audio: ^0.9.0
  
  # Animations
  lottie: ^2.4.0
  
  # UI Utilities
  intl: ^0.20.0
  
  # Localization
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  mockito: ^5.0.0
  
  # Code generation
  hive_generator: ^2.0.0
  build_runner: ^2.3.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/badges/
    - assets/images/icons/
    - assets/images/illustrations/
    - assets/sounds/
    - assets/animations/
  
